[package]
name = "rust_event_engine"
version = "0.1.0"
edition = "2024"

[lib]
name = "rust_event_engine"
crate-type = ["cdylib"]

[dependencies]
pyo3 = { version = "0.28.3", features = ["extension-module"] }
shared_memory = "0.12.4"
libc = "0.2.186"
log = "0.4.29"
env_logger = "0.11.10"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
